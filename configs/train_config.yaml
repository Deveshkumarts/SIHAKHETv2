# ==============================================================================
# YOLO11 Marine Debris Training Configuration
# Tailored for underwater/ocean environments: turbidity, low-light, color cast, small debris
# ==============================================================================

# Model Selection
# Pretrained checkpoints supported: yolo11n.pt, yolo11s.pt, yolo11m.pt, yolo11l.pt, yolo11x.pt
model: yolo11s.pt

# Dataset Path
data: Combined_Dataset/data.yaml

# Training Hyperparameters
epochs: 100
batch: 16                # Adjust if VRAM is constrained (e.g. 8 for 6GB GPUs at higher resolutions)
imgsz: 640               # Supported resolutions to test: 640, 832, 1024
patience: 30             # Early stopping epochs if no mAP improvement
optimizer: auto          # 'auto', 'SGD', 'Adam', 'AdamW'
lr0: 0.01                # Initial learning rate
lrf: 0.01                # Final learning rate fraction (lr0 * lrf)
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Device & Performance
# device: '0' for first GPU, 'cpu' for CPU fallback, 'auto' for automatic detection
device: auto
workers: 4               # Dataloader workers (set 2-4 on Windows to prevent shared memory locks)
amp: true                # Automatic Mixed Precision (FP16) - speeds up GPU training & cuts VRAM in half
cache: false             # Set true or 'ram' if enough RAM to cache images in memory

# ==============================================================================
# Marine-Specific Data Augmentations
# ==============================================================================
# Underwater imagery varies heavily by water depth, green/blue attenuation, and silt.
# The following augmentations simulate these physical optical variations without distorting debris shape.

hsv_h: 0.015             # Image HSV-Hue augmentation (simulates varying water color tint)
hsv_s: 0.5               # Image HSV-Saturation augmentation (simulates water turbidity / washed out colors)
hsv_v: 0.4               # Image HSV-Value augmentation (simulates depth-related illumination drop)
degrees: 10.0            # Image rotation (+/- deg) - debris can tumble in current
translate: 0.1           # Image translation (+/- fraction)
scale: 0.5               # Image scale (+/- gain) - critical for learning multiscale debris
shear: 2.0               # Image shear (+/- deg)
perspective: 0.0001      # Perspective distortion (subtle to prevent unnatural warping)
flipud: 0.0              # Underwater objects rarely appear upside down relative to camera gravity
fliplr: 0.5              # Horizontal flip probability (standard left-right invariance)
mosaic: 1.0              # Mosaic augmentation probability (mixes 4 images; strong for small objects)
mixup: 0.1               # Mixup probability (simulates overlapping transparent floating plastics/silt)
copy_paste: 0.1          # Segment/box copy paste probability (enhances rare debris class representation)
erasing: 0.2             # Random erasing probability (simulates occlusion by seaweeds/fish/silt)

# Output Directory
project: outputs/training
name: baseline_yolo11s
save: true
save_period: -1          # Save checkpoint every x epochs (-1 = only best & last)
plots: true              # Generate training curves, PR curves, confusion matrix
verbose: true
